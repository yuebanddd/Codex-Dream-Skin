name: Preview packages

on:
  workflow_dispatch:
  pull_request:
    branches: [release]
    paths:
      - "client/**"
      - ".signpath/**"
      - ".github/workflows/preview-packages.yml"
      - "docs/preview-builds.md"
      - "docs/signpath-setup.md"
      - "LICENSE"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "SIGNING_POLICY.md"
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: preview-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG (arm64)
            os: macos-15
            bundle: dmg
            artifact: LumaDrobe-macOS-arm64
          - name: Windows NSIS (x64)
            os: windows-2025
            bundle: nsis
            artifact: LumaDrobe-Windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    env:
      LUMADROBE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LUMADROBE_SIGNPATH_ENABLED: ${{ github.event_name == 'push' && vars.SIGNPATH_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:version
      - name: Read Windows release version
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        id: release-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "SignPath version must be x.y.z; received '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build unsigned macOS preview package
        if: runner.os == 'macOS'
        run: npm run build:desktop -- --bundles ${{ matrix.bundle }}
      - name: Build unsigned Windows package
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED != 'true'
        run: npm run build:desktop -- --bundles nsis
      - name: Validate SignPath release configuration
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "SIGNPATH_ENABLED is true but required configuration is missing: $($missing -join ', ')"
          }
      - name: Build Windows application without bundling
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        run: npm run build:desktop -- --no-bundle
      - name: Stage unsigned Windows application for SignPath
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src-tauri/target/release/lumadrobe.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Expected application executable was not produced: $source"
          }
          New-Item -ItemType Directory -Force signpath-app-input | Out-Null
          Copy-Item -LiteralPath $source -Destination signpath-app-input/lumadrobe.exe
      - name: Upload unsigned Windows application
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        id: unsigned-windows-app
        uses: actions/upload-artifact@v4
        with:
          name: LumaDrobe-SignPath-App-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/signpath-app-input/lumadrobe.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows application with SignPath Foundation
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/client/signpath-app-signed
          parameters: |
            version: ${{ toJSON(steps.release-version.outputs.version) }}
      - name: Verify and install signed Windows application
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matches = @(Get-ChildItem signpath-app-signed -Recurse -File -Filter lumadrobe.exe)
          if ($matches.Count -ne 1) {
            throw "SignPath must return exactly one lumadrobe.exe; received $($matches.Count)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Signed application Authenticode status is $($signature.Status): $($signature.StatusMessage)"
          }
          $publisher = if ($null -eq $signature.SignerCertificate) { '' } else {
            $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
          }
          if ($null -eq $signature.SignerCertificate -or
              $publisher -ne 'SignPath Foundation') {
            throw "Signed application publisher is '$publisher', not SignPath Foundation"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Signed application does not contain a trusted timestamp"
          }
          Copy-Item -LiteralPath $matches[0].FullName -Destination src-tauri/target/release/lumadrobe.exe -Force
          Write-Host "Verified signed application publisher: $publisher"
      - name: Bundle signed Windows application
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        run: npm run tauri -- bundle --bundles nsis
      - name: Stage unsigned Windows installer for SignPath
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matches = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter *.exe)
          if ($matches.Count -ne 1) {
            throw "Tauri must produce exactly one NSIS installer; received $($matches.Count)"
          }
          New-Item -ItemType Directory -Force signpath-installer-input | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination signpath-installer-input/LumaDrobe-Setup.exe
      - name: Upload unsigned Windows installer
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        id: unsigned-windows-installer
        uses: actions/upload-artifact@v4
        with:
          name: LumaDrobe-SignPath-Installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/signpath-installer-input/LumaDrobe-Setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer with SignPath Foundation
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/client/signpath-installer-signed
          parameters: |
            version: ${{ toJSON(steps.release-version.outputs.version) }}
      - name: Verify and collect signed Windows installer
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matches = @(Get-ChildItem signpath-installer-signed -Recurse -File -Filter *.exe)
          if ($matches.Count -ne 1) {
            throw "SignPath must return exactly one installer; received $($matches.Count)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Signed installer Authenticode status is $($signature.Status): $($signature.StatusMessage)"
          }
          $publisher = if ($null -eq $signature.SignerCertificate) { '' } else {
            $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
          }
          if ($null -eq $signature.SignerCertificate -or
              $publisher -ne 'SignPath Foundation') {
            throw "Signed installer publisher is '$publisher', not SignPath Foundation"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Signed installer does not contain a trusted timestamp"
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination artifacts/LumaDrobe-Setup.exe
          Write-Host "Verified signed installer publisher: $publisher"
      - name: Collect macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -exec cp '{}' artifacts/ \;
      - name: Collect Windows package
        if: runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Copy-Item -Destination artifacts
      - name: Write build metadata and checksums
        env:
          LUMADROBE_SIGNED: ${{ runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true' && 'true' || 'false' }}
          LUMADROBE_SIGNATURE_PROVIDER: ${{ runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true' && 'SignPath.io' || '' }}
          LUMADROBE_SIGNATURE_PUBLISHER: ${{ runner.os == 'Windows' && env.LUMADROBE_SIGNPATH_ENABLED == 'true' && 'SignPath Foundation' || '' }}
        run: node scripts/write-build-info.mjs artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release_gate:
    name: Verify release assets
    needs: package
    runs-on: ubuntu-latest
    env:
      LUMADROBE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LUMADROBE_REQUIRE_WINDOWS_SIGNATURE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release' && vars.SIGNPATH_ENABLED == 'true' && 'true' || 'false' }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      windows_signed: ${{ steps.release.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Verify and prepare release assets
        id: release
        run: node client/scripts/prepare-release-assets.mjs downloaded-artifacts release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: LumaDrobe-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish preview release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: release_gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LumaDrobe-release-assets
          path: release-assets
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release_gate.outputs.tag }}
          VERSION: ${{ needs.release_gate.outputs.version }}
          WINDOWS_SIGNED: ${{ needs.release_gate.outputs.windows_signed }}
        shell: bash
        run: |
          if [ "$WINDOWS_SIGNED" = "true" ]; then
            WINDOWS_TRUST_NOTE="Windows 安装包由 release 提交 \`${GITHUB_SHA}\` 自动构建，经 SignPath Foundation Authenticode 签名并通过发布门禁验证。"
          else
            WINDOWS_TRUST_NOTE="Windows 安装包由 release 提交 \`${GITHUB_SHA}\` 自动构建，当前未使用 Authenticode 签名；Microsoft Smart App Control 仍可能阻止运行。"
          fi
          cat > release-notes.md <<EOF
          ## 下载

          - Windows x64：\`LumaDrobe-v${VERSION}-Windows-x64-Setup.exe\`
          - macOS Apple Silicon：\`LumaDrobe-v${VERSION}-macOS-arm64.dmg\`
          ${WINDOWS_TRUST_NOTE} macOS 安装包仍为未签名预览版。安装前可使用同平台的 \`SHA256SUMS.txt\` 校验文件。

          **Code signing policy：** [SIGNING_POLICY.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/SIGNING_POLICY.md)
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_TARGET=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)
            if [ "$EXISTING_TARGET" != "$GITHUB_SHA" ]; then
              echo "Refusing to replace $TAG because it targets $EXISTING_TARGET, not $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "LumaDrobe $TAG" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
