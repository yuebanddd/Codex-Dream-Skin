[package]
name = "lumadrobe"
version = "0.2.0"
description = "A decentralized desktop theme wardrobe"
authors = ["LumaDrobe contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lumadrobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8.2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
